[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "touchpath"
version = "0.1.0"
description = "Multi-touch attribution engine for marketing measurement: heuristic, Markov-chain and Shapley-value models over event data."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Bhushan Ladde" }]
keywords = ["attribution", "marketing", "measurement", "mta", "markov", "shapley", "incrementality"]
dependencies = ["duckdb>=1.0"]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "jinja2>=3.1", "python-multipart>=0.0.9"]
dev = ["pytest>=8.0", "pandas>=2.0", "httpx>=0.27", "fastapi>=0.110", "uvicorn[standard]>=0.27", "jinja2>=3.1", "python-multipart>=0.0.9"]
docs = ["sphinx>=7.0", "furo>=2024.1", "sphinx-copybutton>=0.5"]

[project.scripts]
touchpath = "touchpath.cli:main"

[tool.setuptools.package-data]
"touchpath.web" = ["templates/*.html", "static/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
